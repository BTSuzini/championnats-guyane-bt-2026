<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inscriptions — Championnats Guyane Beach Tennis</title>

<style>
/* --- TON CSS IDENTIQUE (inchangé) --- */
:root{
  --clay:#c65a1e; --clay-dark:#8e3a13; --clay-light:#ee8a3a;
  --sky:#27bced; --aqua:#00a9c8; --blue:#075b9a; --blue-dark:#063b72;
  --text:#17212b; --muted:#667085; --card:rgba(255,255,255,.94);
  --shadow:0 16px 40px rgba(16,24,40,.12);
  --container:1180px; --zone-h:104px;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
    radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
    linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#ffffff 100%);
}

a{color:inherit;text-decoration:none;}
.container{width:min(var(--container), calc(100% - 28px));margin:0 auto;}

main{
  padding-top:calc(var(--public-total-top, 158px) + var(--zone-h) + 30px);
  padding-bottom:42px;
}

/* --- zone buttons --- */
.public-zone-btn{
  flex:0 0 auto;
  padding:7px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.36);
  background:rgba(255,255,255,.82);
  font-weight:1000;
  cursor:pointer;
}

.public-zone-btn[aria-selected="true"]{
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  color:#fff;
}

/* --- reste inchangé --- */
</style>
</head>

<body>

<div id="publicHeader"></div>

<!-- 🔥 SOUS BANDEAU CORRIGÉ -->
<section class="public-zonebar">
  <div class="public-container public-zonebar-inner">

    <div class="public-zone-line">
      <button class="public-zone-btn" data-categorie="U14">U14</button>
      <button class="public-zone-btn" data-categorie="U18">U18</button>
      <button class="public-zone-btn" data-categorie="Seniors">Seniors</button>
      <button class="public-zone-btn" data-categorie="45+">45+</button>
    </div>

    <div class="public-zone-line">
      <button class="public-zone-btn" data-epreuve="DM">👨 Double Messieurs</button>
      <button class="public-zone-btn" data-epreuve="DD">👩 Double Dames</button>
    </div>

  </div>
</section>

<main class="container">

<form id="signupForm">

<!-- catégories -->
<input type="radio" name="categorie" value="U14" id="catU14">
<input type="radio" name="categorie" value="U18" id="catU18">
<input type="radio" name="categorie" value="Seniors" id="catSeniors">
<input type="radio" name="categorie" value="45+" id="cat45">

<!-- épreuves -->
<input type="radio" name="epreuve" value="DM" id="epreuveDM">
<input type="radio" name="epreuve" value="DD" id="epreuveDD">

</form>

</main>

<script type="module" src="../assets/js/public-header.js"></script>

<script>
/* =========================
   🔥 SYNCHRO BANDEAU ↔ FORM
   ========================= */

const catBtns = document.querySelectorAll("[data-categorie]");
const epBtns  = document.querySelectorAll("[data-epreuve]");

function updateUI(){
  const cat = document.querySelector('input[name="categorie"]:checked')?.value;
  const ep  = document.querySelector('input[name="epreuve"]:checked')?.value;

  catBtns.forEach(btn=>{
    btn.setAttribute("aria-selected", btn.dataset.categorie === cat);
  });

  epBtns.forEach(btn=>{
    btn.setAttribute("aria-selected", btn.dataset.epreuve === ep);
  });
}

/* --- clic catégorie --- */
catBtns.forEach(btn=>{
  btn.onclick = () => {
    document.querySelector(`input[name="categorie"][value="${btn.dataset.categorie}"]`).checked = true;
    updateUI();
  };
});

/* --- clic épreuve --- */
epBtns.forEach(btn=>{
  btn.onclick = () => {
    document.querySelector(`input[name="epreuve"][value="${btn.dataset.epreuve}"]`).checked = true;
    updateUI();
  };
});

/* --- synchro quand on clique dans le formulaire --- */
document.querySelectorAll('input[name="categorie"], input[name="epreuve"]')
  .forEach(input=>{
    input.addEventListener("change", updateUI);
  });

updateUI();
</script>

</body>
</html>
