<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restauration — Championnats Guyane Beach Tennis</title>

  <style>
    :root{
      --clay:#c65a1e; --clay-dark:#8e3a13; --clay-light:#ee8a3a;
      --sky:#27bced; --aqua:#00a9c8; --blue:#075b9a; --blue-dark:#063b72;
      --text:#17212b; --muted:#667085; --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
      --zone-h:104px;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
        linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#ffffff 100%);
    }

    a{color:inherit;text-decoration:none;}
    img{display:block;max-width:100%;}

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--public-total-top, 158px) + var(--zone-h) + 30px);
      padding-bottom:42px;
    }

    .section{margin-top:16px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.6);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }

    .panel-title{
      margin:0;
      font-size:26px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .panel-text{
      margin:6px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.35;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 13px;
      border-radius:999px;
      background:#e4f7ff;
      color:var(--blue-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .tabs{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-bottom:14px;
    }

    .tab-btn{
      appearance:none;
      border:1px solid rgba(7,91,154,.14);
      background:#fff;
      border-radius:999px;
      min-height:46px;
      padding:10px 16px;
      font-size:14px;
      font-weight:1000;
      cursor:pointer;
      color:#1c2430;
      text-align:center;
      box-shadow:0 6px 14px rgba(16,24,40,.05);
    }

    .tab-btn[aria-selected="true"]{
      background:linear-gradient(180deg,var(--blue),var(--blue-dark));
      color:#fff;
      border-color:var(--blue);
      box-shadow:0 10px 22px rgba(7,91,154,.22);
    }

    .content-box{
      margin-top:12px;
      padding:15px 16px;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(39,188,237,.12),rgba(198,90,30,.08));
      border:1px solid rgba(39,188,237,.22);
      color:#475467;
      font-size:15px;
      line-height:1.5;
    }

    .content-box strong{
      color:var(--blue-dark);
    }

    .menu-img{
      margin-top:14px;
      width:100%;
      border-radius:18px;
      border:1px solid rgba(16,24,40,.08);
      box-shadow:0 8px 18px rgba(16,24,40,.08);
      background:#fff;
    }

    .tab-panel[hidden]{display:none;}

    @media (min-width:760px){
      :root{--zone-h:104px;}
      .panel{padding:22px;}
      .tabs{grid-template-columns:repeat(3,1fr);}
    }

    @media (max-width:759px){
      :root{--zone-h:104px;}

      main{
        padding-top:calc(var(--public-total-top, 150px) + var(--zone-h) + 28px);
      }

      .panel-title{font-size:24px;}
    }
  </style>
</head>

<body>

<div id="publicHeader"></div>

<section class="public-zonebar">
  <div class="public-container public-zonebar-inner">
    <div class="public-zone-line" aria-label="Catégories concernées">
      <button class="public-zone-btn" type="button" aria-selected="true">U14</button>
      <button class="public-zone-btn" type="button" aria-selected="true">U18</button>
      <button class="public-zone-btn" type="button" aria-selected="true">Seniors</button>
      <button class="public-zone-btn" type="button" aria-selected="true">45+</button>
    </div>

    <div class="public-zone-line" aria-label="Épreuves concernées">
      <button class="public-zone-btn" type="button" aria-selected="true">👨 Double Messieurs</button>
      <button class="public-zone-btn" type="button" aria-selected="true">👩 Double Dames</button>
    </div>
  </div>
</section>

<main class="container">

  <section class="section">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h1 class="panel-title">🍽️ Restauration</h1>
          <p class="panel-text">
            Repas, buvette et rafraîchissements pendant les Championnats.
          </p>
        </div>
        <div class="panel-tag">Infos</div>
      </div>

      <div class="tabs" role="tablist" aria-label="Restauration">
        <button class="tab-btn" id="tab-restauration" type="button" role="tab" aria-selected="true" aria-controls="panel-restauration" data-tab="restauration">
          🍽️ Restauration
        </button>

        <button class="tab-btn" id="tab-buvette" type="button" role="tab" aria-selected="false" aria-controls="panel-buvette" data-tab="buvette">
          ☕ Buvette
        </button>

        <button class="tab-btn" id="tab-glacieres" type="button" role="tab" aria-selected="false" aria-controls="panel-glacieres" data-tab="glacieres">
          🧊 Glacières
        </button>
      </div>

      <div class="tab-panel" id="panel-restauration" role="tabpanel" aria-labelledby="tab-restauration">
        <div class="content-box">
          <strong>🍽️ Snack Amazonie</strong><br>
          Le Snack Amazonie sera présent à partir de 18h00.
        </div>

        <img class="menu-img" src="../assets/img/snack.png" alt="Carte du Snack Amazonie">
      </div>

      <div class="tab-panel" id="panel-buvette" role="tabpanel" aria-labelledby="tab-buvette" hidden>
        <div class="content-box">
          <strong>☕ Passing Shot Kafé</strong><br>
          Le Passing Shot Kafé sera ouvert à partir de 18h00.
        </div>

        <img class="menu-img" src="../assets/img/psk.png" alt="Passing Shot Kafé">
      </div>

      <div class="tab-panel" id="panel-glacieres" role="tabpanel" aria-labelledby="tab-glacieres" hidden>
        <div class="content-box">
          <strong>🧊 Glacières</strong><br>
          Rafraîchissements disponibles toute la journée.
        </div>
      </div>

    </div>
  </section>

</main>

<script type="module" src="../assets/js/public-header.js"></script>

<script>
  const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
  const tabPanels = Array.from(document.querySelectorAll(".tab-panel"));

  function activateTab(tabName){
    tabButtons.forEach(btn => {
      const active = btn.dataset.tab === tabName;
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });

    tabPanels.forEach(panel => {
      panel.hidden = panel.id !== `panel-${tabName}`;
    });
  }

  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      activateTab(btn.dataset.tab);
    });
  });
</script>

</body>
</html>
