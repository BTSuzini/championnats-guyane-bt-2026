<script type="module">
  import { db } from "../assets/js/firebase.js";
  import {
    collection,
    query,
    orderBy,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "championnats-2026";

  const EPREUVE_LABELS = {
    DM: "Double Messieurs",
    DD: "Double Dames"
  };

  let currentCategorie = "U14";
  let currentEpreuve = "DM";
  let allRows = [];

  const statusEl = document.getElementById("status");
  const currentLabelEl = document.getElementById("currentLabel");

  const totalCountEl = document.getElementById("totalCount");
  const mainCountEl = document.getElementById("mainCount");
  const waitCountEl = document.getElementById("waitCount");
  const stbyCountEl = document.getElementById("stbyCount");
  const mainCount2El = document.getElementById("mainCount2");
  const waitCount2El = document.getElementById("waitCount2");
  const rankedCountEl = document.getElementById("rankedCount");

  const mainList = document.getElementById("mainList");
  const waitList = document.getElementById("waitList");
  const rankedList = document.getElementById("rankedList");

  const tabInscrits = document.getElementById("tabInscrits");
  const tabClassees = document.getElementById("tabClassees");
  const panelInscrits = document.getElementById("panelInscrits");
  const panelClassees = document.getElementById("panelClassees");

  const categoryButtons = Array.from(document.querySelectorAll(".category-btn"));
  const epreuveButtons = Array.from(document.querySelectorAll(".epreuve-btn"));

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  function normalize(s){
    return (s ?? "").toString().trim();
  }

  function toNum(v){
    if(v === null || v === undefined || v === "") return null;
    const n = typeof v === "number" ? v : Number(String(v).replace(",", ".").trim());
    return Number.isFinite(n) ? n : null;
  }

  function fmtRank(n){
    return (n === null || n === undefined) ? "—" : String(n);
  }

  function statusPill(r){
    return r.stby
      ? `<span class="pill stby">STBY</span>`
      : `<span class="pill">OK</span>`;
  }

  function cardInscritHtml(idx, r){
    return `
      <div class="team-card">
        <div class="team-left">
          <div class="team-line1">
            <span class="team-num">#${idx}</span>
            <span class="team-name">${esc(r.teamName)}</span>
            <span class="team-meta">${esc(r.categorie)} • ${esc(r.epreuve)}</span>
          </div>
          <div class="team-line2">${esc(r.joueur1FirstName)} / ${esc(r.joueur2FirstName)}</div>
        </div>
        <div class="team-right">
          ${statusPill(r)}
        </div>
      </div>
    `;
  }

  function cardClasseeHtml(idx, r){
    const p1 = toNum(r.p1Rank);
    const p2 = toNum(r.p2Rank);
    const teamRank = (p1 !== null && p2 !== null) ? (p1 + p2) : null;

    return `
      <div class="team-card">
        <div class="team-left">
          <div class="team-line1">
            <span class="team-num">#${idx}</span>
            <span class="team-name">${esc(r.teamName)}</span>
            <span class="team-meta">🏷️ ${esc(fmtRank(teamRank))}</span>
          </div>
          <div class="team-line2">
            ${esc(r.joueur1FirstName)} (${esc(fmtRank(p1))}) / ${esc(r.joueur2FirstName)} (${esc(fmtRank(p2))})
          </div>
        </div>
        <div class="team-right">
          ${statusPill(r)}
        </div>
      </div>
    `;
  }

  function updateButtons(){
    categoryButtons.forEach(btn => {
      btn.setAttribute("aria-selected", btn.dataset.categorie === currentCategorie ? "true" : "false");
    });

    epreuveButtons.forEach(btn => {
      btn.setAttribute("aria-selected", btn.dataset.epreuve === currentEpreuve ? "true" : "false");
    });

    currentLabelEl.textContent = `${currentCategorie} — ${EPREUVE_LABELS[currentEpreuve]}`;
  }

  function render(){
    updateButtons();

    const filtered = allRows.filter(r =>
      normalize(r.categorie) === normalize(currentCategorie) &&
      normalize(r.epreuve) === normalize(currentEpreuve)
    );

    filtered.sort((a,b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));

    const main = filtered.filter(r => r.list !== "wait");
    const wait = filtered.filter(r => r.list === "wait");

    totalCountEl.textContent = filtered.length;
    mainCountEl.textContent = main.length;
    waitCountEl.textContent = wait.length;
    stbyCountEl.textContent = filtered.filter(r => r.stby).length;
    mainCount2El.textContent = main.length;
    waitCount2El.textContent = wait.length;

    mainList.innerHTML = main.length
      ? main.map((r,i) => cardInscritHtml(i+1, r)).join("")
      : `<p class="muted" style="margin:0;">Aucune équipe pour le moment.</p>`;

    waitList.innerHTML = wait.length
      ? wait.map((r,i) => cardInscritHtml(main.length+i+1, r)).join("")
      : `<p class="muted" style="margin:0;">Aucune équipe en liste d’attente.</p>`;

    const ranked = [...main].sort((a,b)=>{
      const a1 = toNum(a.p1Rank), a2 = toNum(a.p2Rank);
      const b1 = toNum(b.p1Rank), b2 = toNum(b.p2Rank);
      const at = (a1 !== null && a2 !== null) ? (a1+a2) : Number.POSITIVE_INFINITY;
      const bt = (b1 !== null && b2 !== null) ? (b1+b2) : Number.POSITIVE_INFINITY;
      if(at !== bt) return at - bt;
      return (a.createdAtMs||0) - (b.createdAtMs||0);
    });

    rankedCountEl.textContent = ranked.length;

    rankedList.innerHTML = ranked.length
      ? ranked.map((r,i) => cardClasseeHtml(i+1, r)).join("")
      : `<p class="muted" style="margin:0;">Aucune équipe sur la liste principale.</p>`;

    statusEl.textContent = `🟢 En direct — ${currentCategorie} / ${EPREUVE_LABELS[currentEpreuve]}`;
  }

  function setCategory(categorie){
    currentCategorie = categorie;
    localStorage.setItem("champ_equipes_categorie", currentCategorie);
    render();
  }

  function setEpreuve(epreuve){
    currentEpreuve = epreuve;
    localStorage.setItem("champ_equipes_epreuve", currentEpreuve);
    render();
  }

  function showInscrits(){
    tabInscrits.setAttribute("aria-selected", "true");
    tabClassees.setAttribute("aria-selected", "false");
    panelInscrits.style.display = "block";
    panelClassees.style.display = "none";
    localStorage.setItem("champ_equipes_view", "inscrits");
  }

  function showClassees(){
    tabInscrits.setAttribute("aria-selected", "false");
    tabClassees.setAttribute("aria-selected", "true");
    panelInscrits.style.display = "none";
    panelClassees.style.display = "block";
    localStorage.setItem("champ_equipes_view", "classees");
  }

  categoryButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      setCategory(btn.dataset.categorie);
    });
  });

  epreuveButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      setEpreuve(btn.dataset.epreuve);
    });
  });

  tabInscrits.addEventListener("click", showInscrits);
  tabClassees.addEventListener("click", showClassees);

  const savedCat = localStorage.getItem("champ_equipes_categorie");
  const savedEpreuve = localStorage.getItem("champ_equipes_epreuve");
  const savedView = localStorage.getItem("champ_equipes_view");

  if(["U14","U18","Seniors","45+"].includes(savedCat)) currentCategorie = savedCat;
  if(["DM","DD"].includes(savedEpreuve)) currentEpreuve = savedEpreuve;
  if(savedView === "classees") showClassees();
  else showInscrits();

  updateButtons();

  const q = query(
    collection(db, "events", EVENT_ID, "equipes"),
    orderBy("createdAt", "asc")
  );

  onSnapshot(q, (snap) => {
    allRows = [];

    snap.forEach(docSnap => {
      const d = docSnap.data() || {};

      allRows.push({
        id: docSnap.id,
        teamName: d.teamName || "",
        categorie: d.categorie || "",
        epreuve: d.epreuve || "",
        joueur1FirstName: d.joueur1FirstName || "",
        joueur2FirstName: d.joueur2FirstName || "",
        createdAtMs: d.createdAt?.toMillis ? d.createdAt.toMillis() : 0,
        list: d.list || "main",
        stby: d.stby === true,
        p1Rank: d.p1Rank ?? null,
        p2Rank: d.p2Rank ?? null
      });
    });

    render();
  }, (err) => {
    console.error(err);
    statusEl.textContent = "🔴 Erreur de connexion Firestore.";
  });
</script>
