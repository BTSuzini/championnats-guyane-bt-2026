<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Équipes — Championnats Guyane Beach Tennis</title>

  <style>
    :root{
      --clay:#c65a1e;
      --clay-dark:#8e3a13;
      --clay-light:#ee8a3a;
      --sky:#27bced;
      --aqua:#00a9c8;
      --blue:#075b9a;
      --blue-dark:#063b72;
      --text:#17212b;
      --muted:#667085;
      --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
        linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#fff 100%);
    }

    a{color:inherit;text-decoration:none;}

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--admin-total-top, 276px) + 42px);
      padding-bottom:42px;
    }

    .section{margin-top:22px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.6);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }

    .panel-title{
      margin:0;
      font-size:28px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .panel-text{
      margin:8px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 13px;
      border-radius:999px;
      background:#e4f7ff;
      color:var(--blue-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(16,24,40,.10);
      background:#fff;
      border-radius:18px;
      min-height:54px;
      padding:13px 15px;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
      color:#1c2430;
      text-align:center;
      box-shadow:0 8px 16px rgba(16,24,40,.04);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn.primary{
      background:linear-gradient(180deg,var(--blue),var(--blue-dark));
      color:#fff;
      border-color:var(--blue);
    }

    .status-box{
      margin-top:14px;
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(39,188,237,.12),rgba(198,90,30,.08));
      border:1px solid rgba(39,188,237,.22);
      color:#475467;
      font-size:14px;
      line-height:1.5;
    }

    .muted{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    .team-card{
      border:1px solid rgba(16,24,40,.08);
      border-radius:20px;
      background:#fff;
      box-shadow:0 8px 18px rgba(16,24,40,.06);
      padding:14px;
      display:grid;
      gap:10px;
    }

    .team-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .team-name{
      font-weight:1000;
      font-size:18px;
      line-height:1.15;
      word-break:break-word;
    }

    .badges{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid #eee;
      background:#fafafa;
      color:#333;
      white-space:nowrap;
      font-weight:1000;
    }

    .pill.main{border-color:#d9f2df;background:#f3fff6;}
    .pill.wait{border-color:#ffe1a6;background:#fff8e6;}
    .pill.stby{border-color:#ffd37a;background:#fff7e6;}
    .pill.rank{border-color:#d9e6ff;background:#f3f7ff;color:var(--blue-dark);}
    .pill.cat{border-color:#e4dbff;background:#f7f3ff;}

    .player{
      display:grid;
      gap:6px;
      padding:10px;
      border:1px solid #f1f1f1;
      border-radius:14px;
      background:#fcfcfc;
    }

    .player-title{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .player-title b{font-weight:1000;}

    .player-meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      line-height:1.25;
    }

    .kv{
      display:inline-flex;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #eee;
      background:#fff;
      font-size:12px;
      white-space:nowrap;
    }

    .kv .k{color:#666;font-weight:800;}
    .kv .v{font-weight:1000;}

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btnx{
      padding:9px 12px;
      border-radius:999px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-weight:1000;
      color:#111;
    }

    .btnx:hover{background:#f5f5f5;}
    .btnx.danger{border-color:#f1b2b2;}
    .btnx.danger:hover{background:#ffecec;}

    details{
      border-top:1px solid rgba(16,24,40,.08);
      padding-top:8px;
    }

    details summary{
      cursor:pointer;
      list-style:none;
      font-weight:1000;
      color:var(--blue-dark);
    }

    details summary::-webkit-details-marker{display:none;}

    @media (min-width:760px){
      .panel{padding:24px;}
      .grid.three{grid-template-columns:1fr 1fr 1fr;}
    }
  </style>
</head>

<body data-zone-selector="select">

<div id="adminHeader"></div>

<main class="container">

  <section class="section panel" id="accessDenied" style="display:none;">
    <h2 class="panel-title">⛔ Accès refusé</h2>
    <p class="panel-text">Cette page est réservée aux administrateurs.</p>
  </section>

  <section class="section panel" id="panelSummary" style="display:none;">
    <div class="panel-head">
      <div>
        <h2 class="panel-title">📌 Résumé</h2>
        <p class="panel-text" id="counts">Chargement…</p>
      </div>
      <div class="panel-tag">Équipes</div>
    </div>

    <div class="status-box" id="hint">Chargement…</div>
    <p class="muted" id="status" style="margin-top:10px;">Connexion…</p>
  </section>

  <section class="section panel" id="panelList" style="display:none;">
    <div class="panel-head">
      <div>
        <h2 class="panel-title">👥 Équipes</h2>
        <p class="panel-text">Gestion des inscriptions privées et de l’affichage public.</p>
      </div>
      <div class="panel-tag">Liste</div>
    </div>

    <div class="grid three" style="margin-bottom:12px;">
      <button class="btn" id="btnRefresh">🔄 Rafraîchir</button>
      <button class="btn" id="btnExpand">🧩 Tout développer</button>
      <button class="btn" id="btnCollapse">🧊 Tout réduire</button>
    </div>

    <div id="list" style="display:grid;gap:12px;"></div>
  </section>

</main>

<script type="module" src="../assets/js/admin-header.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js";
  import { getRoleByUid } from "../assets/js/session.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "championnats-2026";

  const EPREUVE_LABELS = {
    DM: "Double Messieurs",
    DD: "Double Dames"
  };

  const accessDenied = document.getElementById("accessDenied");
  const panelSummary = document.getElementById("panelSummary");
  const panelList = document.getElementById("panelList");

  const hintEl = document.getElementById("hint");
  const countsEl = document.getElementById("counts");
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");

  const btnRefresh = document.getElementById("btnRefresh");
  const btnExpand = document.getElementById("btnExpand");
  const btnCollapse = document.getElementById("btnCollapse");

  let currentCategorie = "U14";
  let currentEpreuve = "DM";
  let liveRows = [];
  let isAdminReady = false;

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmt(v){
    const t = (v ?? "").toString().trim();
    return t === "" ? "—" : t;
  }

  function toNum(v){
    if(v === null || v === undefined || v === "") return null;
    const n = typeof v === "number" ? v : Number(String(v).replace(",", ".").trim());
    return Number.isFinite(n) ? n : null;
  }

  function fmtRank(v){
    const n = toNum(v);
    return n === null ? "—" : String(n);
  }

  function teamRank(p1, p2){
    const a = toNum(p1), b = toNum(p2);
    if(a === null || b === null) return null;
    return a + b;
  }

  function zoneText(){
    return `${currentCategorie} — ${EPREUVE_LABELS[currentEpreuve]}`;
  }

  function zoneEmoji(){
    return currentEpreuve === "DD" ? "👩" : "👨";
  }

  function updateZoneDisplay(){
    hintEl.textContent = `${zoneEmoji()} Zone sélectionnée : ${zoneText()}.`;
  }

  function pillList(list){
    if(list === "main") return `<span class="pill main">MAIN</span>`;
    if(list === "wait") return `<span class="pill wait">WAIT</span>`;
    return `<span class="pill">AUTO</span>`;
  }

  function pillStby(stby){
    return stby ? `<span class="pill stby">STBY</span>` : `<span class="pill">OK</span>`;
  }

  function computeCounts(rows){
    const total = rows.length;
    const main = rows.filter(r => r.list === "main" && !r.stby).length;
    const wait = rows.filter(r => r.list === "wait" && !r.stby).length;
    const auto = rows.filter(r => !r.list && !r.stby).length;
    const stby = rows.filter(r => r.stby).length;
    return { total, main, wait, auto, stby };
  }

  function playerLineHtml(label, p){
    return `
      <div class="player">
        <div class="player-title">
          <b>${label}</b>
          <span class="pill rank">🏷️ ${esc(fmtRank(p.rank))}</span>
        </div>

        <div class="player-meta">
          <span class="kv"><span class="k">Nom</span><span class="v">${esc(fmt(p.lastName))}</span></span>
          <span class="kv"><span class="k">Prénom</span><span class="v">${esc(fmt(p.firstName))}</span></span>
          <span class="kv"><span class="k">Licence</span><span class="v">${esc(fmt(p.licence))}</span></span>
          <span class="kv"><span class="k">Tél</span><span class="v">${esc(fmt(p.phone))}</span></span>
        </div>
      </div>
    `;
  }

  function render(rows){
    liveRows = rows.slice();

    const c = computeCounts(rows);
    countsEl.innerHTML =
      `${zoneEmoji()} <b>${zoneText()}</b> — Total : <b>${c.total}</b> — MAIN : <b>${c.main}</b> — WAIT : <b>${c.wait}</b> — AUTO : <b>${c.auto}</b> — STBY : <b>${c.stby}</b>`;

    listEl.innerHTML = rows.length ? rows.map((r, i) => {
      const tr = teamRank(r.p1Rank, r.p2Rank);

      return `
        <div class="team-card" data-id="${esc(r.id)}">
          <div class="team-head">
            <div>
              <div class="team-name">${esc(fmt(r.teamName))}</div>
              <div class="muted" style="margin-top:6px;">
                #${i+1} • ID : <span style="font-variant-numeric:tabular-nums;">${esc(r.id)}</span>
                ${tr === null ? "" : ` • <span class="pill rank">🏷️ Rang équipe : ${esc(String(tr))}</span>`}
              </div>
            </div>

            <div class="badges">
              <span class="pill cat">${esc(zoneText())}</span>
              ${pillList(r.list)}
              ${pillStby(r.stby)}
            </div>
          </div>

          ${playerLineHtml("Joueur/Joueuse 1", {
            firstName: r.p1FirstName, lastName: r.p1LastName, licence: r.p1Licence, phone: r.p1Phone, rank: r.p1Rank
          })}

          ${playerLineHtml("Joueur/Joueuse 2", {
            firstName: r.p2FirstName, lastName: r.p2LastName, licence: r.p2Licence, phone: r.p2Phone, rank: r.p2Rank
          })}

          <details>
            <summary>⚙️ Actions / Modifier</summary>
            <div style="margin-top:10px;display:grid;gap:10px;">
              <div class="actions">
                <button class="btnx" data-act="edit" data-id="${esc(r.id)}">✏️ Modifier équipe</button>
                <button class="btnx" data-act="ranks" data-id="${esc(r.id)}">🏷️ Classements</button>
              </div>

              <div class="actions">
                <button class="btnx" data-act="main" data-id="${esc(r.id)}">⬆️ MAIN</button>
                <button class="btnx" data-act="wait" data-id="${esc(r.id)}">⬇️ WAIT</button>
                <button class="btnx" data-act="auto" data-id="${esc(r.id)}">🌀 AUTO</button>
                <button class="btnx" data-act="stby" data-id="${esc(r.id)}">${r.stby ? "✅ Activer" : "⏸️ STBY"}</button>
              </div>

              <div class="actions">
                <button class="btnx danger" data-act="del" data-id="${esc(r.id)}">🗑️ Supprimer</button>
              </div>
            </div>
          </details>
        </div>
      `;
    }).join("") : `<p class="muted" style="margin:0;">Aucune équipe pour ${esc(zoneText())}.</p>`;
  }

  async function fetchMerged(){
    statusEl.textContent = "Chargement…";

    const [privSnap, pubSnap] = await Promise.all([
      getDocs(query(collection(db, "events", EVENT_ID, "inscriptions"), orderBy("createdAt", "asc"))),
      getDocs(query(collection(db, "events", EVENT_ID, "equipes"), orderBy("createdAt", "asc")))
    ]);

    const pubById = new Map();
    pubSnap.forEach(d => pubById.set(d.id, d.data() || {}));

    const rows = [];

    privSnap.forEach(d => {
      const x = d.data() || {};
      const p = pubById.get(d.id) || {};

      const categorie = x.categorie || p.categorie || "";
      const epreuve = x.epreuve || p.epreuve || "";

      if(categorie !== currentCategorie || epreuve !== currentEpreuve) return;

      rows.push({
        id: d.id,
        createdAtMs: x.createdAt?.toMillis ? x.createdAt.toMillis() : 0,

        teamName: x.teamName || p.teamName || "",

        p1FirstName: x.joueur1?.firstName || x.p1FirstName || p.joueur1FirstName || "",
        p1LastName: x.joueur1?.lastName || x.p1LastName || "",
        p1Licence: x.joueur1?.licence || x.p1Licence || "",
        p1Phone: x.joueur1?.phone || x.p1Phone || "",
        p1Rank: p.p1Rank ?? null,

        p2FirstName: x.joueur2?.firstName || x.p2FirstName || p.joueur2FirstName || "",
        p2LastName: x.joueur2?.lastName || x.p2LastName || "",
        p2Licence: x.joueur2?.licence || x.p2Licence || "",
        p2Phone: x.joueur2?.phone || x.p2Phone || "",
        p2Rank: p.p2Rank ?? null,

        list: p.list || null,
        stby: p.stby === true
      });
    });

    rows.sort((a,b)=> (a.createdAtMs || 0) - (b.createdAtMs || 0));
    return rows;
  }

  async function refresh(){
    try{
      updateZoneDisplay();
      const rows = await fetchMerged();
      render(rows);
      statusEl.textContent = `✅ OK — ${zoneText()}`;
    }catch(err){
      console.error(err);
      statusEl.textContent = `❌ Erreur ${zoneText()} — voir console`;
    }
  }

  async function patchPublic(id, patch){
    await setDoc(doc(db, "events", EVENT_ID, "equipes", id), {
      ...patch,
      updatedAt: serverTimestamp(),
      updatedBy: auth.currentUser?.uid || null
    }, { merge:true });
  }

  async function patchPrivate(id, patch){
    await updateDoc(doc(db, "events", EVENT_ID, "inscriptions", id), {
      ...patch,
      updatedAt: serverTimestamp(),
      updatedBy: auth.currentUser?.uid || null
    });
  }

  async function editTeam(row){
    const teamName = prompt("Nom d’équipe :", row.teamName || "");
    if(teamName === null) return;

    const p1LastName = prompt("J1 — Nom :", row.p1LastName || "");
    if(p1LastName === null) return;
    const p1FirstName = prompt("J1 — Prénom :", row.p1FirstName || "");
    if(p1FirstName === null) return;
    const p1Licence = prompt("J1 — Licence :", row.p1Licence || "");
    if(p1Licence === null) return;
    const p1Phone = prompt("J1 — Téléphone :", row.p1Phone || "");
    if(p1Phone === null) return;

    const p2LastName = prompt("J2 — Nom :", row.p2LastName || "");
    if(p2LastName === null) return;
    const p2FirstName = prompt("J2 — Prénom :", row.p2FirstName || "");
    if(p2FirstName === null) return;
    const p2Licence = prompt("J2 — Licence :", row.p2Licence || "");
    if(p2Licence === null) return;
    const p2Phone = prompt("J2 — Téléphone :", row.p2Phone || "");
    if(p2Phone === null) return;

    await patchPrivate(row.id, {
      teamName,
      joueur1: {
        firstName: p1FirstName,
        lastName: p1LastName,
        licence: p1Licence,
        phone: p1Phone
      },
      joueur2: {
        firstName: p2FirstName,
        lastName: p2LastName,
        licence: p2Licence,
        phone: p2Phone
      }
    });

    await patchPublic(row.id, {
      teamName,
      joueur1FirstName: p1FirstName,
      joueur2FirstName: p2FirstName
    });
  }

  async function editRanks(row){
    const n1 = prompt("Classement BT Joueur/Joueuse 1 :", String(row.p1Rank ?? ""));
    if(n1 === null) return;

    const n2 = prompt("Classement BT Joueur/Joueuse 2 :", String(row.p2Rank ?? ""));
    if(n2 === null) return;

    const p1t = String(n1).trim();
    const p2t = String(n2).trim();

    const p1 = p1t === "" ? null : toNum(p1t);
    const p2 = p2t === "" ? null : toNum(p2t);

    if(p1t !== "" && p1 === null) return alert("Classement J1 invalide.");
    if(p2t !== "" && p2 === null) return alert("Classement J2 invalide.");

    await patchPublic(row.id, { p1Rank:p1, p2Rank:p2 });
  }

  async function deleteTeam(id){
    const ok = confirm("Supprimer cette équipe ?\n\n⚠️ Action irréversible.");
    if(!ok) return;

    await deleteDoc(doc(db, "events", EVENT_ID, "inscriptions", id));
    await deleteDoc(doc(db, "events", EVENT_ID, "equipes", id));
  }

  listEl.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if(!btn) return;

    const act = btn.dataset.act;
    const id = btn.dataset.id;
    const row = liveRows.find(r => r.id === id);

    if(!row) return alert("Équipe introuvable. Rafraîchis la page.");

    try{
      if(act === "main") await patchPublic(id, { list:"main" });
      if(act === "wait") await patchPublic(id, { list:"wait" });
      if(act === "auto") await patchPublic(id, { list:null });
      if(act === "stby") await patchPublic(id, { stby:!row.stby });

      if(act === "ranks") await editRanks(row);
      if(act === "edit") await editTeam(row);
      if(act === "del") await deleteTeam(id);

      await refresh();
    }catch(err){
      console.error(err);
      alert("Erreur ❌ — voir console.");
    }
  });

  btnExpand.onclick = () => document.querySelectorAll("details").forEach(d => d.open = true);
  btnCollapse.onclick = () => document.querySelectorAll("details").forEach(d => d.open = false);
  btnRefresh.onclick = refresh;

  document.addEventListener("adminZoneChange", async (event) => {
    const detail = event.detail || {};

    if(!detail.categorie || !detail.epreuve) return;

    currentCategorie = detail.categorie;
    currentEpreuve = detail.epreuve;

    if(isAdminReady){
      await refresh();
    }
  });

  function showDenied(){
    accessDenied.style.display = "block";
    panelSummary.style.display = "none";
    panelList.style.display = "none";
  }

  function showAdmin(){
    accessDenied.style.display = "none";
    panelSummary.style.display = "block";
    panelList.style.display = "block";
  }

  onAuthStateChanged(auth, async (user) => {
    if(!user){
      showDenied();
      return;
    }

    try{
      const role = await getRoleByUid(user.uid);

      if(role !== "admin"){
        showDenied();
        return;
      }

      isAdminReady = true;
      showAdmin();
      await refresh();

    }catch(err){
      console.error(err);
      showDenied();
    }
  });
</script>

</body>
</html>
