<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Inscriptions — Championnats Guyane Beach Tennis</title>

  <style>
    :root{
      --clay:#c65a1e;
      --clay-dark:#8e3a13;
      --clay-light:#ee8a3a;
      --sky:#27bced;
      --sky-soft:#e4f7ff;
      --aqua:#00a9c8;
      --blue:#075b9a;
      --blue-dark:#063b72;
      --text:#17212b;
      --muted:#667085;
      --card:rgba(255,255,255,.94);
      --shadow:0 16px 40px rgba(16,24,40,.12);
      --container:1180px;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(39,188,237,.22), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(0,169,200,.16), transparent 26%),
        linear-gradient(180deg,#f4fcff 0%,#e9f8ff 48%,#ffffff 100%);
    }

    a{color:inherit;text-decoration:none;}

    .container{
      width:min(var(--container), calc(100% - 28px));
      margin:0 auto;
    }

    main{
      padding-top:calc(var(--admin-total-top, 276px) + 42px);
      padding-bottom:42px;
    }

    .section{margin-top:22px;}

    .panel{
      background:var(--card);
      border:1px solid rgba(255,255,255,.6);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:20px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }

    .panel-title{
      margin:0;
      font-size:28px;
      line-height:1.05;
      letter-spacing:-.03em;
    }

    .panel-text{
      margin:8px 0 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .panel-tag{
      flex-shrink:0;
      padding:8px 13px;
      border-radius:999px;
      background:#e4f7ff;
      color:var(--blue-dark);
      font-size:12px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(39,188,237,.28);
      background:linear-gradient(180deg,#e4f7ff,#c9f0ff);
      border-radius:18px;
      min-height:54px;
      padding:13px 15px;
      font-size:15px;
      font-weight:1000;
      cursor:pointer;
      color:var(--blue-dark);
      text-align:center;
      box-shadow:0 8px 16px rgba(16,24,40,.04);
    }

    .btn.active{
      background:linear-gradient(180deg,var(--blue),var(--blue-dark));
      color:#fff;
      border-color:var(--blue);
      box-shadow:0 10px 22px rgba(7,91,154,.22);
    }

    .btn.disabled,
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .status-box{
      margin-top:12px;
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(135deg,rgba(39,188,237,.12),rgba(198,90,30,.08));
      border:1px solid rgba(39,188,237,.22);
      color:#475467;
      font-size:14px;
      line-height:1.5;
    }

    .muted{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    @media (min-width:760px){
      .panel{
        padding:24px;
      }

      .grid.actions{
        grid-template-columns:repeat(4,1fr);
      }
    }
  </style>
</head>

<body data-zone-selector="none">

<div id="adminHeader"></div>

<main class="container">

  <section class="section panel" id="accessDenied" style="display:none;">
    <h2 class="panel-title">⛔ Accès refusé</h2>
    <p class="panel-text">Cette page est réservée aux administrateurs.</p>
  </section>

  <section class="section panel" id="panelInscriptions" style="display:none;">
    <div class="panel-head">
      <div>
        <h2 class="panel-title">📝 Statut global des inscriptions</h2>
        <p class="panel-text" id="currentState">Chargement…</p>
      </div>
      <div class="panel-tag">Global</div>
    </div>

    <p class="muted" id="statusMsg"></p>

    <div class="grid actions" style="margin-top:12px;">
      <button class="btn" id="btnNotOpen">💤 Pas encore ouvertes</button>
      <button class="btn" id="btnOpen">✅ Ouvrir</button>
      <button class="btn" id="btnPause">⏸️ Suspendre</button>
      <button class="btn" id="btnClose">🔒 Clôturer</button>
    </div>

    <div class="status-box">
      Ce statut est valable pour <strong>toutes les catégories</strong> et <strong>toutes les épreuves</strong>.
      <br>
      Il est enregistré dans :
      <br>
      <strong>events/championnats-2026/config/inscriptions</strong>
    </div>
  </section>

</main>

<script type="module" src="../assets/js/admin-header.js"></script>

<script type="module">
  import { auth, db } from "../assets/js/firebase.js";
  import { getRoleByUid } from "../assets/js/session.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc,
    setDoc,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const EVENT_ID = "championnats-2026";

  const accessDenied = document.getElementById("accessDenied");
  const panelInscriptions = document.getElementById("panelInscriptions");

  const currentStateEl = document.getElementById("currentState");
  const statusMsgEl = document.getElementById("statusMsg");

  const btnNotOpen = document.getElementById("btnNotOpen");
  const btnOpen = document.getElementById("btnOpen");
  const btnPause = document.getElementById("btnPause");
  const btnClose = document.getElementById("btnClose");

  const cfgRef = doc(db, "events", EVENT_ID, "config", "inscriptions");

  let currentState = "not_open";
  let unsubConfig = null;

  function normState(value){
    if(value === "suspended") return "paused";
    return value || "not_open";
  }

  function labelFor(state){
    switch(normState(state)){
      case "not_open": return "💤 Pas encore ouvertes";
      case "open": return "✅ Ouvertes";
      case "paused": return "⏸️ Suspendues";
      case "closed": return "🔒 Clôturées";
      default: return "—";
    }
  }

  function publicMessage(state){
    switch(normState(state)){
      case "not_open": return "Le public verra : “Les inscriptions ne sont pas encore ouvertes.”";
      case "open": return "Le public verra : “Inscriptions ouvertes ✅”.";
      case "paused": return "Le public verra : “Inscriptions suspendues ⏸️”.";
      case "closed": return "Le public verra : “Inscriptions clôturées 🔒”.";
      default: return "";
    }
  }

  function refreshButtons(){
    const buttons = [
      { el: btnNotOpen, state: "not_open" },
      { el: btnOpen, state: "open" },
      { el: btnPause, state: "paused" },
      { el: btnClose, state: "closed" }
    ];

    buttons.forEach(item => {
      item.el.classList.toggle("active", currentState === item.state);
    });
  }

  function refreshStateDisplay(){
    currentStateEl.innerHTML = `Statut actuel : <strong>${labelFor(currentState)}</strong>`;
    statusMsgEl.textContent = publicMessage(currentState);
    refreshButtons();
  }

  function setButtonsDisabled(disabled){
    [btnNotOpen, btnOpen, btnPause, btnClose].forEach(btn => {
      btn.disabled = disabled;
      btn.classList.toggle("disabled", disabled);
    });
  }

  async function setState(next){
    if(next === currentState){
      return;
    }

    if(next === "closed"){
      const ok = confirm("Clôturer les inscriptions pour toutes les catégories et toutes les épreuves ?");
      if(!ok) return;
    }

    if(next === "not_open"){
      const ok = confirm("Remettre le statut global sur “pas encore ouvertes” ?");
      if(!ok) return;
    }

    setButtonsDisabled(true);
    statusMsgEl.textContent = "Mise à jour…";

    try{
      await setDoc(cfgRef, {
        state: next,
        updatedAt: serverTimestamp(),
        updatedBy: auth.currentUser?.uid || null
      }, { merge:true });

      statusMsgEl.textContent = "✅ Statut mis à jour.";
    }catch(error){
      console.error(error);
      statusMsgEl.textContent = "❌ Erreur : impossible de mettre à jour.";
    }finally{
      setButtonsDisabled(false);
    }
  }

  btnNotOpen.onclick = () => setState("not_open");
  btnOpen.onclick = () => setState("open");
  btnPause.onclick = () => setState("paused");
  btnClose.onclick = () => setState("closed");

  onAuthStateChanged(auth, async (user) => {
    accessDenied.style.display = "none";
    panelInscriptions.style.display = "none";

    if(unsubConfig){
      unsubConfig();
      unsubConfig = null;
    }

    if(!user){
      accessDenied.style.display = "block";
      return;
    }

    const role = await getRoleByUid(user.uid);

    if(role !== "admin"){
      accessDenied.style.display = "block";
      return;
    }

    panelInscriptions.style.display = "block";

    unsubConfig = onSnapshot(cfgRef, (snap) => {
      const data = snap.exists() ? (snap.data() || {}) : {};
      currentState = normState(data.state || "not_open");
      refreshStateDisplay();
    }, (error) => {
      console.error(error);
      currentStateEl.textContent = "❌ Impossible de lire le statut.";
    });
  });
</script>

</body>
</html>
